    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 大模型 分析用户留言+行为数据+用户公司战略 背后的意向强度
        model:
          completion_params: {}
          mode: chat
          name: glm-5v-turbo
          provider: langgenius/zhipuai/zhipuai
        prompt_template:
        - id: sys_intent
          role: system
          text: '你是 CRM 线索意向识别助手。阅读客户原始留言+行为数据+用户公司战略，从资深销售视角判断意向强度，仅输出 JSON。

            输出格式：{"intent_score": 0到30的整数, "intent_tag": "集成需求/价格咨询/演示试用/技术咨询/一般了解/随便看看
            之一", "reason": "评分理由一句话"}

            评分标准：

            - 提到与现有系统集成、嵌入、API/iframe 对接：25-30

            - 主动问报价、价格、费用：22-28

            - 想预约演示、申请试用：18-24

            - 询问功能细节、实现方式：10-16

            - 泛泛了解、随便看看：0-6

            - 其他一般咨询：7-12

            - 非决策场景优先降档：留言中出现「作业、课程、老师要求、论文、毕设、考试、调研、学习」等学生/课程场景词时，无论是否同时出现「功能、了解、方案」等词，一律给
            0-5 分；这类留言不是采购决策，不应进入培育池

            - 判断顺序：先判断是否属于非决策场景，再按上面的档位定分'
        - id: usr_intent
          role: user
          text: 客户留言：{{#start.lead_raw#}}
        selected: false
        title: 意图评分
        type: llm
        variables: []
        vision:
          enabled: false
      height: 131
      id: intent_llm
      position:
        x: 1046.9657438876368
        y: 385.8918036712609
      positionAbsolute:
        x: 1046.9657438876368
        y: 385.8918036712609
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "import json, re\n\ndef main(llm_text: str) -> dict:\n    text = (llm_text\
          \ or '').strip()\n    score, tag, reason = 8, '一般了解', '未解析出JSON，按一般咨询兜底'\n\
          \    m = re.search(r'\\{.*\\}', text, re.S)\n    if m:\n        try:\n \
          \           obj = json.loads(m.group(0))\n            score = int(obj.get('intent_score',\
          \ 8))\n            tag = str(obj.get('intent_tag', '一般了解'))\n          \
          \  reason = str(obj.get('reason', ''))[:80]\n        except Exception:\n\
          \            pass\n    score = max(0, min(30, score))\n    return {'intent_score':\
          \ score, 'intent_tag': tag, 'reason': reason}\n"
        code_language: python3
        desc: 解析 LLM 输出，解析失败自动兜底
        outputs:
          intent_score:
            children: null
            type: number
          intent_tag:
            children: null
            type: string
          reason:
            children: null
            type: string
        selected: false
        title: 意图结果解析
        type: code
        variables:
        - value_selector:
          - intent_llm
          - text
          variable: llm_text
      height: 79
      id: parse_intent
      position:
        x: 1401.8866818462145
        y: 385.8918036712609
      positionAbsolute:
        x: 1401.8866818462145
        y: 385.8918036712609
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "def main(attribute_score: float, behavior_score: float, intent_score:\
          \ float) -> dict:\n    total = int(round((attribute_score or 0) + (behavior_score\
          \ or 0) + (intent_score or 0)))\n    if total >= 60:\n        grade = 'SQL'\n\
          \    elif total >= 30:\n        grade = 'MQL'\n    else:\n        grade\
          \ = 'INVALID'\n    return {'total_score': total, 'grade': grade}\n"
        code_language: python3
        desc: 三维合分，60/30 阈值分级
        outputs:
          grade:
            children: null
            type: string
          total_score:
            children: null
            type: number
        selected: false
        title: 总分汇总
        type: code
        variables:
        - value_selector:
          - rules
          - attribute_score
          variable: attribute_score
        - value_selector:
          - rules
          - behavior_score
          variable: behavior_score
        - value_selector:
          - parse_intent
          - intent_score
