    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 把非结构化留言提取成标准字段
        model:
          completion_params: {}
          mode: chat
          name: glm-5v-turbo
          provider: langgenius/zhipuai/zhipuai
        prompt_template:
        - id: sys_extract
          role: system
          text: '你是 CRM 线索清洗助手。从客户原始留言+爬取的客户数据+我的公司评判标准中提取结构化信息，仅输出 JSON，不要输出任何其他内容。

            输出格式：{"need_summary": "客户核心诉求一句话不超过30字", "need_keywords": ["关键词最多5个"],
            "contact": "联系方式或null"}

            规则：

            1. 只依据留言原文提取，禁止编造。

            2. 数字、产品名保持原样。'
        - id: usr_extract
          role: user
          text: 客户留言：{{#start.lead_raw#}}
        selected: false
        title: 结构化提取
        type: llm
        variables: []
        vision:
          enabled: false
      height: 115
      id: extract
      position:
        x: 596.1254961141833
        y: 385.8918036712609
      positionAbsolute:
        x: 596.1254961141833
        y: 385.8918036712609
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "def main(industry: str, company_size: str, job_title: str, behaviors_raw:\
          \ str) -> dict:\n    import re\n    industry_score = {'软件/互联网': 15, '制造业':\
          \ 10, '金融': 12, '医疗': 10, '教育': 5, '学生个人': -20}\n    size_score = {'500人以上':\
          \ 15, '100-499人': 12, '20-99人': 8, '1-19人': 5, '个人/无': -5}\n    title_score\
          \ = {'IT负责人/技术总监': 15, '采购/商务负责人': 12, '销售/市场负责人': 8, '普通员工': 3, '学生': 0}\n\
          \    behav_score = {'下载白皮书': 8, '观看演示视频': 12, '访问集成对接页': 10, '打开报价邮件': 15,\
          \ '一周内多次访问官网': 10, '预约产品演示': 15}\n\n    def pick(d, k, default):\n     \
          \   try:\n            return d.get(k, default)\n        except Exception:\n\
          \            return default\n\n    i = pick(industry_score, industry, 3)\n\
          \    s = pick(size_score, company_size, 3)\n    j = pick(title_score, job_title,\
          \ 3)\n    attr = max(0, min(45, i + s + j))\n    attr_detail = '行业[{}]:\
          \ {:+d}；规模[{}]: {:+d}；岗位[{}]: {:+d}'.format(industry, i, company_size, s,\
          \ job_title, j)\n\n    tokens = re.split(r'[、,，;；/\\s]+', behaviors_raw\
          \ or '')\n    behav = 0\n    parts = []\n    for t in tokens:\n        t\
          \ = t.strip()\n        if t and t in behav_score:\n            behav +=\
          \ behav_score[t]\n            parts.append('{}: +{}'.format(t, behav_score[t]))\n\
          \    behav = min(25, behav)\n    behav_detail = '；'.join(parts) if parts\
          \ else '无行为记录'\n    return {'attribute_score': attr, 'attribute_detail':\
          \ attr_detail, 'behavior_score': behav, 'behavior_detail': behav_detail}\n"
        code_language: python3
        desc: 属性分 + 行为分，规则固定可控
        outputs:
          attribute_detail:
            children: null
            type: string
          attribute_score:
            children: null
            type: number
          behavior_detail:
            children: null
            type: string
          behavior_score:
            children: null
            type: number
        selected: false
        title: 规则评分器
        type: code
        variables:
        - value_selector:
          - start
          - industry
          variable: industry
        - value_selector:
          - start
          - company_size
          variable: company_size
        - value_selector:
          - start
          - job_title
          variable: job_title
        - value_selector:
          - start
          - behaviors
          variable: behaviors_raw
